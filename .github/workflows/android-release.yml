name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, for example 1.2.0"
        required: true
        type: string
      version_code:
        description: "Optional Android versionCode; derived from version name when empty"
        required: false
        type: string
      release_notes:
        description: "Release notes shown in the app"
        required: false
        type: string
      prerelease:
        description: "Create a GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_OBJECT_PREFIX: ${{ vars.ANDROID_OBJECT_PREFIX || 'android' }}
      ANDROID_UPDATE_MANIFEST_KEY: ${{ vars.ANDROID_UPDATE_MANIFEST_KEY || 'api/android/update.json' }}

      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      # Public OSS settings may be stored as repository Variables (preferred)
      # or Secrets for compatibility with existing repository configuration.
      ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET || secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}

      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      TENCENT_COS_TOKEN: ${{ secrets.TENCENT_COS_TOKEN }}
      TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION || secrets.TENCENT_COS_REGION }}
      TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET || secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_PUBLIC_BASE_URL: ${{ vars.TENCENT_COS_PUBLIC_BASE_URL || secrets.TENCENT_COS_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release metadata
        id: release
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "${INPUT_VERSION_NAME//[[:space:]]/}" ]]; then
            echo "::error::version_name is required for a manual Android release."
            exit 1
          fi

          metadata_args=(
            metadata
            --version-name "$INPUT_VERSION_NAME"
            --ref-name "$GITHUB_REF_NAME"
          )
          if [[ -n "${INPUT_VERSION_CODE//[[:space:]]/}" ]]; then
            metadata_args+=(--version-code "$INPUT_VERSION_CODE")
          fi

          python scripts/release/android_release.py \
            "${metadata_args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are incomplete."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lanerc-release.jks"
          test -s "$RUNNER_TEMP/lanerc-release.jks"

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MANIFEST_URLS=""
          if [[ -n "${ALIYUN_OSS_PUBLIC_BASE_URL:-}" ]]; then
            MANIFEST_URLS="${ALIYUN_OSS_PUBLIC_BASE_URL%/}/${ANDROID_UPDATE_MANIFEST_KEY}"
          fi
          if [[ -n "${TENCENT_COS_PUBLIC_BASE_URL:-}" ]]; then
            if [[ -n "$MANIFEST_URLS" ]]; then
              MANIFEST_URLS+=","
            fi
            MANIFEST_URLS+="${TENCENT_COS_PUBLIC_BASE_URL%/}/${ANDROID_UPDATE_MANIFEST_KEY}"
          fi
          cd android
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleRelease \
            -PLANERC_VERSION_NAME="$VERSION_NAME" \
            -PLANERC_VERSION_CODE="$VERSION_CODE" \
            -PLANERC_UPDATE_MANIFEST_URLS="$MANIFEST_URLS" \
            -PLANERC_RELEASE_STORE_FILE="$RUNNER_TEMP/lanerc-release.jks" \
            -PLANERC_RELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PLANERC_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PLANERC_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Prepare release files
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          if [[ -n "$RELEASE_NOTES_INPUT" ]]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > release/release-notes.md
          else
            printf '%s\n' "性能优化、问题修复与稳定性提升。" > release/release-notes.md
          fi
          python scripts/release/android_release.py manifest \
            --apk "release/$APK_NAME" \
            --output release/update.json \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG_NAME" \
            --notes-file release/release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: juying-${{ steps.release.outputs.version_name }}
          path: |
            release/${{ steps.release.outputs.apk_name }}
            release/update.json
            release/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Install cloud upload SDKs
        run: python -m pip install --disable-pip-version-check -r scripts/release/requirements.txt

      - name: Upload to Aliyun OSS and Tencent COS
        id: cloud-upload
        continue-on-error: true
        run: |
          python scripts/release/android_release.py upload \
            --apk "release/${{ steps.release.outputs.apk_name }}" \
            --manifest release/update.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "release/$APK_NAME" release/update.json --clobber
            gh release edit "$TAG_NAME" \
              --title "juying $VERSION_NAME" \
              --notes-file release/release-notes.md
          else
            EXTRA_ARGS=()
            if [[ "$PRERELEASE" == "true" ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG_NAME" \
              "release/$APK_NAME" \
              release/update.json \
              --target "$GITHUB_SHA" \
              --title "juying $VERSION_NAME" \
              --notes-file release/release-notes.md \
              "${EXTRA_ARGS[@]}"
          fi

      - name: Report cloud upload failure
        if: steps.cloud-upload.outcome == 'failure'
        run: |
          echo "::warning::GitHub Release succeeded, but one or more optional cloud uploads failed. Check the cloud upload step."

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lanerc-release.jks"
